x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  postgres:
    image: postgres:15-alpine
    container_name: tutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tutor_assist}
      POSTGRES_USER: ${DB_USER:-tutor_assist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    command: ["postgres", "-c", "timezone=${TZ:-Asia/Shanghai}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tutor_assist} -d ${DB_NAME:-tutor_assist}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - tutor-network

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: tutor-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?请配置 ONLYOFFICE_JWT_SECRET}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ONLYOFFICE_PORT:-8283}:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    logging: *default-logging
    networks:
      - tutor-network

  backend:
    image: ${BACKEND_IMAGE:-tutor-assist-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels:
        com.tutor-assist.image-scope: backend
    container_name: tutor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      onlyoffice:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tutor_assist}
      DB_USER: ${DB_USER:-tutor_assist}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      MATERIAL_STORAGE_PATH: /opt/tutor-assist/materials
      ONLYOFFICE_URL: http://onlyoffice:80
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:?请配置 ONLYOFFICE_PUBLIC_URL}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?请配置 BACKEND_PUBLIC_URL}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-WARN}
    ports:
      - "${BACKEND_PORT:-8282}:8080"
    volumes:
      - backup_data:/opt/tutor-assist/backups
      - material_data:/opt/tutor-assist/materials
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    logging: *default-logging
    networks:
      - tutor-network

  frontend:
    image: ${FRONTEND_IMAGE:-tutor-assist-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      labels:
        com.tutor-assist.image-scope: frontend
    container_name: tutor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-8281}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging
    networks:
      - tutor-network

volumes:
  postgres_data:
    name: tutor-assist-postgres-data
  onlyoffice_data:
    name: tutor-assist-onlyoffice-data
  onlyoffice_logs:
    name: tutor-assist-onlyoffice-logs
  backup_data:
    name: tutor-assist-backups
  material_data:
    name: tutor-assist-materials

networks:
  tutor-network:
    name: tutor-assist-network
    driver: bridge
