services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: tutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tutor_assist}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-memoryvault}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tutor_assist}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-memoryvault}
      JWT_SECRET: ${JWT_SECRET:-tutor-assist-secret-key-must-be-at-least-256-bits-long-for-hs256}
      MATERIAL_STORAGE_PATH: /opt/tutor-assist/materials
      ONLYOFFICE_URL: http://onlyoffice:80
      ONLYOFFICE_PUBLIC_URL: http://localhost:${ONLYOFFICE_PORT:-8081}
      ONLYOFFICE_JWT_SECRET: ${JWT_SECRET:-tutor-assist-secret-key-must-be-at-least-256-bits-long-for-hs256}
      BACKEND_PUBLIC_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backup_data:/opt/tutor-assist/backups
      - material_data:/opt/tutor-assist/materials

  # OnlyOffice 文档编辑服务
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: tutor-onlyoffice
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-tutor-assist-secret-key-must-be-at-least-256-bits-long-for-hs256}
      - JWT_ENABLED=true
    ports:
      - "${ONLYOFFICE_PORT:-8081}:80"

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tutor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  backup_data:
  material_data:
